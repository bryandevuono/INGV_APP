name: Flutter macOS Test & Build

on:
  push:
    branches: [ main, mac ]
  pull_request:
    branches: [ main ]

jobs:
  test_and_build_macos:
    runs-on: macos-latest

    # This sets the default directory for all 'run' steps in this job
    defaults:
      run:
        working-directory: ingv_app

    steps:
      # 1. Check out your code repository (Still runs at the repo root)
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Cache Flutter build dependencies
      # Note: The hashFiles path is adjusted to look inside ingv_app
      - name: Cache Flutter Packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-flutter-${{ hashFiles('ingv_app/**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-

      # 3. Set up the Flutter environment
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # 4. Get project dependencies (Now automatically runs inside ingv_app)
      - name: Install Dependencies
        run: flutter pub get


      # 6. Enable macOS desktop target
      - name: Enable macOS Config
        run: flutter config --enable-macos-desktop

      # 7. Test if the macOS application compiles successfully
      - name: Build macOS App
        run: flutter build macos --debug
